name: Build BhartiX OS APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">BhartiX OS</string>|' android/app/src/main/res/values/strings.xml || true
          M=android/app/src/main/AndroidManifest.xml
          for P in RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$P" "$M" || sed -i "s|<application|<uses-permission android:name=\"android.permission.$P\" />\n    <application|" "$M"
          done
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BhartiX-OS-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
